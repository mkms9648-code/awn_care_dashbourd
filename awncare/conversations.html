<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المحادثات — عون كير</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="../config.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside id="app-nav"></aside>
    <main class="main">
      <div class="chatapp">
        <div class="chatapp-list">
          <div class="chatapp-list-header">
            <h2>المحادثات</h2>
            <div class="search-box">
              <i class="ti ti-search"></i>
              <input type="text" id="search-input" placeholder="ابحث بالاسم…" />
            </div>
          </div>
          <div class="chatapp-list-items" id="chat-list"><p class="muted" style="padding:16px;">جاري التحميل…</p></div>
        </div>

        <div class="chatapp-thread">
          <div class="chatapp-thread-header">
            <button type="button" id="back-to-list-btn" class="icon-btn thread-back-btn" title="رجوع"><i class="ti ti-arrow-right"></i></button>
            <div id="thread-header-info"><span class="muted">اختار محادثة من القايمة عشان تشوف تفاصيلها</span></div>
          </div>
          <div class="chatapp-thread-body" id="thread-body">
            <div class="empty-state"><i class="ti ti-message-2" style="font-size:2em;display:block;margin-bottom:10px;"></i>اختار محادثة من القايمة</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { client, requireAdmin, applyProductTheme, escapeHtml, fmtDate, n8nExecutionUrl, initials } from "../assets/core.js";
    import { renderShell } from "../assets/shell.js";

    const PRODUCT = "awncare";
    applyProductTheme(PRODUCT);
    const session = await requireAdmin();
    if (!session) throw new Error("not authorized");
    renderShell(session, { product: PRODUCT, active: "conversations" });

    const sb = client(PRODUCT);
    const BOT_LABELS = { clinic: "عيادة", round: "راوند", ed: "طوارئ" };
    const BOT_ICONS = { clinic: "ti-building-hospital", round: "ti-walk", ed: "ti-ambulance" };
    const PAGE_SIZE = 300;

    const chatappEl = document.querySelector(".chatapp");
    const listEl = document.getElementById("chat-list");
    const searchInput = document.getElementById("search-input");
    const threadHeaderInfo = document.getElementById("thread-header-info");
    const threadBody = document.getElementById("thread-body");
    document.getElementById("back-to-list-btn").addEventListener("click", () => chatappEl.classList.remove("thread-open"));

    let channels = [];
    let activeChannel = null;
    const messagesById = new Map();

    function cleanHumanText(raw) {
      if (!raw) return raw;
      let text = raw;
      if (/^current date and time/i.test(text.trim())) { const i = text.indexOf("\n\n"); if (i !== -1) text = text.slice(i + 2); }
      text = text.replace(/^رسالة الدكتور:?\s*\n/, "");
      return text.trim();
    }
    function cleanAiText(raw) {
      if (!raw) return raw;
      const t = raw.trim();
      if (t.startsWith("{")) {
        try { const p = JSON.parse(t); let o = p.echo || p.message || p.text || ""; if (p.ask && p.ask !== o) o += (o ? "\n\n" : "") + "❓ " + p.ask; return o || raw; } catch { return raw; }
      }
      return raw;
    }
    function currentFiltered() {
      const q = searchInput.value.trim().toLowerCase();
      return q ? channels.filter((c) => (c.full_name || "").toLowerCase().includes(q)) : channels;
    }

    function renderList(items) {
      if (items.length === 0) { listEl.innerHTML = `<div class="empty-state">مفيش محادثات مطابقة.</div>`; return; }
      listEl.innerHTML = items.map((c) => {
        const idx = channels.indexOf(c);
        return `
          <div class="chat-row ${activeChannel === c ? "active" : ""}" data-index="${idx}">
            <div class="chat-avatar">${initials(c.full_name)}</div>
            <div class="chat-row-info">
              <div class="chat-row-name">${escapeHtml(c.full_name)}</div>
              <div class="chat-row-meta"><i class="ti ${BOT_ICONS[c.bot_key] || "ti-message-circle"}"></i>${BOT_LABELS[c.bot_key] || c.bot_key} · ${escapeHtml(c.workspace_name)}</div>
            </div>
          </div>`;
      }).join("");
      listEl.querySelectorAll(".chat-row").forEach((row) => row.addEventListener("click", () => openChannel(channels[Number(row.dataset.index)])));
    }

    async function loadChannels() {
      const { data, error } = await sb.rpc("admin_doctor_channels");
      if (error) { listEl.innerHTML = `<p class="error-msg" style="padding:16px;">${escapeHtml(error.message)}</p>`; return; }
      channels = data || [];
      renderList(currentFiltered());
    }

    async function openChannel(channel) {
      activeChannel = channel;
      renderList(currentFiltered());
      chatappEl.classList.add("thread-open");
      threadHeaderInfo.innerHTML = `
        <div class="chat-avatar">${initials(channel.full_name)}</div>
        <div><div class="title">${escapeHtml(channel.full_name)}</div>
        <div class="subtitle">${escapeHtml(channel.workspace_name)} · ${BOT_LABELS[channel.bot_key] || channel.bot_key}</div></div>`;
      threadBody.innerHTML = `<p class="muted">جاري التحميل…</p>`;
      const { data, error } = await sb.rpc("admin_conversations_feed", {
        p_staff_id: channel.staff_id, p_bot_key: channel.bot_key, p_since: null, p_limit: PAGE_SIZE, p_offset: 0,
      });
      if (error) { threadBody.innerHTML = `<p class="error-msg">${escapeHtml(error.message)}</p>`; return; }
      renderThread((data || []).slice().reverse());
    }

    function renderThread(messages) {
      if (messages.length === 0) { threadBody.innerHTML = `<div class="empty-state">مفيش رسايل لسه.</div>`; return; }
      messagesById.clear();
      let prevRole = null;
      threadBody.innerHTML = messages.map((m) => {
        const isAi = m.role === "ai";
        const grouped = prevRole === m.role; prevRole = m.role;
        const text = isAi ? cleanAiText(m.content) : cleanHumanText(m.content);
        messagesById.set(String(m.msg_id), { original: text || "", translated: null, showing: false });
        const execUrl = n8nExecutionUrl(PRODUCT, m.n8n_workflow_id, m.n8n_execution_id);
        const execBtn = isAi
          ? execUrl
            ? `<a class="icon-btn round" href="${execUrl}" target="_blank" rel="noopener" title="افتح التنفيذ في n8n"><i class="ti ti-git-branch"></i></a>`
            : `<span class="icon-btn round" style="opacity:.4;cursor:default" title="بدون سجل تنفيذ"><i class="ti ti-git-branch-off"></i></span>`
          : "";
        return `
          <div class="bubble ${isAi ? "bubble-ai" : "bubble-human"} ${grouped ? "grouped" : ""}" data-msg-id="${m.msg_id}">
            <div class="bubble-text" dir="auto">${escapeHtml(text || "")}</div>
            <div class="bubble-time">
              <span>${m.occurred_at ? fmtDate(m.occurred_at) : ""}</span>
              <button type="button" class="icon-btn round translate-btn" title="ترجم للعربي"><i class="ti ti-language"></i></button>
              ${execBtn}
            </div>
          </div>`;
      }).join("");
      threadBody.scrollTop = threadBody.scrollHeight;
    }

    async function translateToArabic(text) {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=" + encodeURIComponent(text);
      const res = await fetch(url);
      if (!res.ok) throw new Error("translate_failed");
      const data = await res.json();
      return (data[0] || []).map((seg) => seg[0]).join("");
    }

    threadBody.addEventListener("click", async (e) => {
      const btn = e.target.closest(".translate-btn");
      if (!btn) return;
      const bubble = btn.closest(".bubble");
      const state = messagesById.get(bubble.dataset.msgId);
      if (!state) return;
      const textEl = bubble.querySelector(".bubble-text");
      if (state.showing) { state.showing = false; textEl.textContent = state.original; btn.classList.remove("active"); return; }
      if (state.translated) { state.showing = true; textEl.textContent = state.translated; btn.classList.add("active"); return; }
      const prev = btn.innerHTML;
      btn.innerHTML = `<i class="ti ti-loader-2 spin"></i>`; btn.disabled = true;
      try {
        const t = await translateToArabic(state.original);
        state.translated = t; state.showing = true; textEl.textContent = t; btn.classList.add("active");
      } catch {
        textEl.insertAdjacentHTML("afterend", `<div class="translate-error">تعذّرت الترجمة، حاول تاني</div>`);
        setTimeout(() => bubble.querySelector(".translate-error")?.remove(), 3000);
      } finally { btn.innerHTML = prev; btn.disabled = false; }
    });

    searchInput.addEventListener("input", () => renderList(currentFiltered()));
    loadChannels();
  </script>
</body>
</html>
