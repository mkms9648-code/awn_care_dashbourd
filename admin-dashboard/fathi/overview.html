<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نظرة عامة — فتحي ميزانية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="../config.js"></script>
  <style>
    .c-logo { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; background: var(--ink-strong); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .78em; flex-shrink: 0; overflow: hidden; }
    .c-logo img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="app-nav"></aside>
    <main class="main">
      <div class="page">
        <div class="page-head">
          <div>
            <h1>نظرة عامة — فتحي ميزانية</h1>
            <p class="subtitle">كل العملاء، مين مفعّل، مين عنده كود دخول، ومين الشات مفتوح ليه.</p>
          </div>
          <a href="clients.html" class="btn"><i class="ti ti-user-plus"></i> عميل جديد</a>
        </div>
        <div class="stat-row" id="stat-row"></div>
        <div class="card"><div class="table-wrap" id="table-wrap"><p class="muted">جاري التحميل…</p></div></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAdmin, applyProductTheme, escapeHtml, fmtDate, initials } from "../assets/core.js";
    import { renderShell } from "../assets/shell.js";
    import { ensureSecret, rpc } from "../assets/fathi.js";

    applyProductTheme("fathi");
    const session = await requireAdmin();
    if (!session) throw new Error("not authorized");
    renderShell(session, { product: "fathi", active: "overview" });
    await ensureSecret();

    const tableWrap = document.getElementById("table-wrap");
    const statRow = document.getElementById("stat-row");

    const { data, error } = await rpc("admin_list_companies");
    if (error) {
      tableWrap.innerHTML = `<p class="error-msg">${escapeHtml(error.message)}</p>`;
    } else {
      const cs = data || [];
      const active = cs.filter((c) => c.is_active).length;
      const withCode = cs.filter((c) => c.has_code).length;
      const withChat = cs.filter((c) => c.chat_enabled).length;
      statRow.innerHTML = `
        <div class="stat-tile"><div class="value">${cs.length}</div><div class="label">عميل</div></div>
        <div class="stat-tile"><div class="value">${active}</div><div class="label">مفعّل</div></div>
        <div class="stat-tile"><div class="value">${withCode}</div><div class="label">عنده كود دخول</div></div>
        <div class="stat-tile"><div class="value">${withChat}</div><div class="label">الشات مفتوح</div></div>`;

      if (cs.length === 0) {
        tableWrap.innerHTML = `<div class="empty-state">مفيش عملاء لسه. اضغط «عميل جديد».</div>`;
      } else {
        tableWrap.innerHTML = `
          <table>
            <thead><tr><th>العميل</th><th>العملة</th><th>الحالة</th><th>الشات</th><th>كود الدخول</th><th>أُضيف</th><th></th></tr></thead>
            <tbody>
              ${cs.map((c) => `
                <tr>
                  <td>
                    <div style="display:flex;align-items:center;gap:10px">
                      <div class="c-logo">${c.logo ? `<img src="${escapeHtml(c.logo)}" alt="">` : escapeHtml(initials(c.name))}</div>
                      <div><strong>${escapeHtml(c.name)}</strong>${c.industry ? `<div class="muted">${escapeHtml(c.industry)}</div>` : ""}</div>
                    </div>
                  </td>
                  <td>${escapeHtml(c.currency || "—")}</td>
                  <td><span class="pill ${c.is_active ? "pill-good" : "pill-critical"}">${c.is_active ? "مفعّل" : "موقوف"}</span></td>
                  <td><span class="pill ${c.chat_enabled ? "pill-good" : "pill-muted"}">${c.chat_enabled ? "مفتوح" : "مقفول"}</span></td>
                  <td>${c.has_code ? '<span class="pill pill-accent">موجود</span>' : '<span class="pill pill-muted">مفيش</span>'}</td>
                  <td class="muted">${fmtDate(c.created_at)}</td>
                  <td><a class="icon-btn" title="تحكم" href="subscriptions.html#c-${escapeHtml(c.id)}"><i class="ti ti-settings"></i></a></td>
                </tr>`).join("")}
            </tbody>
          </table>`;
      }
    }
  </script>
</body>
</html>
