<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مساعد المبيعات — فتحي ميزانية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="../config.js"></script>
  <style>
    .assistant { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--paper); }
    .as-head { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--white); border-bottom: 1px solid var(--rule); }
    .as-head .m-icon { width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; }
    .as-head .title { font-weight: 700; color: var(--ink-strong); }
    .as-head .subtitle { font-size: .8em; color: var(--grey-2); }
    .as-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 2px; max-width: 900px; width: 100%; margin: 0 auto; }
    .as-body .bubble { max-width: 78%; }
    .as-intro { margin: auto; text-align: center; color: var(--grey-2); max-width: 460px; }
    .as-intro i { font-size: 2.4em; color: var(--accent); display: block; margin-bottom: 12px; }
    .as-chip-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
    .as-chip { background: var(--white); border: 1px solid var(--rule); border-radius: 100px; padding: 7px 14px; font-size: .82em; cursor: pointer; color: var(--ink); }
    .as-chip:hover { border-color: var(--accent-border); background: var(--accent-light); color: var(--accent-dark); }
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--grey-3); animation: blink 1.2s infinite both; }
    .typing span:nth-child(2){ animation-delay: .2s } .typing span:nth-child(3){ animation-delay: .4s }
    @keyframes blink { 0%,80%,100%{ opacity:.3 } 40%{ opacity:1 } }
    .composer { border-top: 1px solid var(--rule); background: var(--white); padding: 14px 24px; }
    .composer-inner { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    .composer textarea { flex: 1; resize: none; max-height: 160px; border-radius: 14px; padding: 12px 14px; font-size: .95em; line-height: 1.6; }
    .composer .send { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; padding: 0; }
    .as-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); border-radius: 10px; padding: 10px 14px; font-size: .85em; margin: 10px auto; max-width: 900px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="app-nav"></aside>
    <main class="main">
      <div class="assistant">
        <div class="as-head">
          <div class="m-icon"><i class="ti ti-sparkles"></i></div>
          <div style="flex:1">
            <div class="title">مساعد المبيعات — فتحي ميزانية</div>
            <div class="subtitle">اسأله عن الأسعار، الباقات، الدفع، اللينكات، أو أي مشكلة — ويرد باحتراف.</div>
          </div>
          <button class="btn btn-neutral btn-sm" id="edit-kb"><i class="ti ti-book"></i> تعديل المعرفة</button>
          <button class="icon-btn" id="clear-chat" title="محادثة جديدة"><i class="ti ti-refresh"></i></button>
        </div>
        <div id="warn-slot"></div>
        <div class="as-body" id="body">
          <div class="as-intro" id="intro">
            <i class="ti ti-message-chatbot"></i>
            <div>ابدأ بسؤال. مثلًا: "عميل بيسأل عن باقات فتحي وأسعارها" أو "عميل بيقول البرنامج مش بيحفظ القيد، أرد عليه إزاي؟"</div>
            <div class="as-chip-row" id="chips">
              <button class="as-chip">إيه باقات فتحي وأسعارها؟</button>
              <button class="as-chip">طرق الدفع المتاحة؟</button>
              <button class="as-chip">عميل عايز يجرب — أقوله إيه؟</button>
            </div>
          </div>
        </div>
        <div class="composer">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="اكتب سؤالك… (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
            <button class="btn send" id="send" title="إرسال"><i class="ti ti-send"></i></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { client, requireAdmin, applyProductTheme, escapeHtml, productConfig } from "../assets/core.js";
    import { renderShell } from "../assets/shell.js";
    import { openModal, toast, busy } from "../assets/ui.js";

    const PRODUCT = "fathi";
    applyProductTheme(PRODUCT);
    const session = await requireAdmin();
    if (!session) throw new Error("not authorized");
    renderShell(session, { product: PRODUCT, active: "assistant" });

    const sb = client("awncare");                     // المعرفة متخزنة في مشروع عون كير (محمية بـ app_is_admin)
    const endpoint = productConfig(PRODUCT).SALES_ENDPOINT || "";
    const bodyEl = document.getElementById("body");
    const introEl = document.getElementById("intro");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const warnSlot = document.getElementById("warn-slot");

    const sessionId = PRODUCT + "-" + (session.user.id || "anon");
    let history = [];
    let sending = false;

    if (!endpoint) {
      warnSlot.innerHTML = `<div class="as-warn">لسه محتاج تحط رابط مساعد المبيعات (n8n) في <code>config.js</code> تحت <code>PRODUCTS.${PRODUCT}.SALES_ENDPOINT</code>. تقدر تعدّل المعرفة دلوقتي، لكن الرد مش هيشتغل من غير الرابط.</div>`;
    }

    function addBubble(role, text) {
      introEl?.remove();
      const isAi = role === "ai";
      const el = document.createElement("div");
      el.className = "bubble " + (isAi ? "bubble-ai" : "bubble-human");
      el.innerHTML = `<div class="bubble-text" dir="auto"></div>`;
      el.querySelector(".bubble-text").textContent = text;
      bodyEl.appendChild(el);
      bodyEl.scrollTop = bodyEl.scrollHeight;
      return el;
    }

    function showTyping() {
      introEl?.remove();
      const el = document.createElement("div");
      el.className = "bubble bubble-ai";
      el.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
      bodyEl.appendChild(el);
      bodyEl.scrollTop = bodyEl.scrollHeight;
      return el;
    }

    async function send(text) {
      text = (text || inputEl.value).trim();
      if (!text || sending) return;
      if (!endpoint) { toast("حط رابط المساعد في config.js الأول", "error"); return; }
      sending = true;
      inputEl.value = ""; autosize();
      addBubble("human", text);
      history.push({ role: "user", content: text });
      const typing = showTyping();
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ product: PRODUCT, message: text, session_id: sessionId, history }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json().catch(() => ({}));
        const reply = data.reply || data.output || data.text || data.answer || "";
        typing.remove();
        if (!reply) { addBubble("ai", "معرفتش أجيب رد. اتأكد إن قالب n8n مظبوط ويرجّع { reply }."); }
        else { addBubble("ai", reply); history.push({ role: "assistant", content: reply }); }
      } catch (err) {
        typing.remove();
        addBubble("ai", "حصل خطأ في الاتصال بالمساعد: " + err.message);
      } finally {
        sending = false;
      }
    }

    function autosize() { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px"; }
    inputEl.addEventListener("input", autosize);
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
    sendBtn.addEventListener("click", () => send());
    document.getElementById("chips").addEventListener("click", (e) => { const c = e.target.closest(".as-chip"); if (c) send(c.textContent); });
    document.getElementById("clear-chat").addEventListener("click", () => { history = []; bodyEl.innerHTML = ""; location.reload(); });

    document.getElementById("edit-kb").addEventListener("click", async () => {
      const { data, error } = await sb.rpc("admin_get_sales_kb", { p_product: PRODUCT });
      if (error) { toast(error.message, "error"); return; }
      const kb = data || { persona: "", knowledge: "" };
      const body = document.createElement("div");
      body.innerHTML = `
        <div class="field">
          <label class="lbl">شخصية الرد / الاتفاق (إزاي يرد)</label>
          <textarea id="persona" rows="5" placeholder="مثال: أنت مدير مبيعات فتحي ميزانية. رد باحترام ونبرة تسويقية، حل المشاكل بهدوء، ولا توعد بحاجة مش موجودة…"></textarea>
        </div>
        <div class="field">
          <label class="lbl">المعرفة (أسعار / باقات / طرق دفع / لينكات / تقني)</label>
          <textarea id="knowledge" rows="12" placeholder="اكتب كل تفاصيل المشروع هنا… الأسعار، الباقات، طرق الدفع، لينكات التسجيل، حلول المشاكل الشائعة…"></textarea>
        </div>
        <div class="hint">المساعد بيقرا الكلام ده لحظيًا في كل رد. حدّثه أول بأول.</div>`;
      body.querySelector("#persona").value = kb.persona || "";
      body.querySelector("#knowledge").value = kb.knowledge || "";
      const m = openModal({
        title: "معرفة مساعد المبيعات", subtitle: "فتحي ميزانية", icon: "ti-book", wide: true,
        body, actionsLeadSpacer: true,
        actions: [
          { label: "إلغاء", variant: "btn-neutral", onClick: (close) => close() },
          { label: "حفظ", icon: "ti-check", onClick: async (close) => {
              const btn = m.root.querySelector('[data-act="1"]'); const restore = busy(btn, "بيحفظ…");
              const { error: e2 } = await sb.rpc("admin_set_sales_kb", {
                p_product: PRODUCT,
                p_persona: body.querySelector("#persona").value,
                p_knowledge: body.querySelector("#knowledge").value,
              });
              if (e2) { restore(); toast(e2.message, "error"); return; }
              close(); toast("اتحفظت المعرفة", "good");
            } },
        ],
      });
    });
  </script>
</body>
</html>
