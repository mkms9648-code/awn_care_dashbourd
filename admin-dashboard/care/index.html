<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Awn Care</title>
<meta name="description" content="Awn Care — personal assistant for resident physicians" />

<!-- iOS app feel -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Awn Care" />
<meta name="theme-color" content="#0A0E1A" />
<link rel="apple-touch-icon" href="app_logo.png" />
<link rel="icon" href="app_logo.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
:root{
  --primary:#3B6FF2; --primary-light:#5B8DFF; --accent:#E65100;
  --red:#C62828; --green:#2E7D32; --amber:#B45309;
  --navy:#0A0E1A; --muted-navy:#8B94AC;
  --bg:#F4F7FC; --bg-2:#e9eef7; --card:#FFFFFF; --card-2:#f5f8fd;
  --text:#0A0E1A; --muted:#5B6472; --faint:#96a0b0;
  --line:rgba(10,14,26,.08); --line-2:rgba(10,14,26,.05);
  --shadow:0 1px 2px rgba(10,14,26,.05), 0 10px 26px rgba(10,14,26,.06);
  --bubble-me:#3B6FF2; --bubble-me-text:#fff; --bubble-ai:#ffffff; --bubble-ai-text:#0A0E1A;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#5B8DFF; --primary-light:#7BA4FF;
    --bg:#0A0E1A; --bg-2:#0e1424; --card:#141B2E; --card-2:#1a2338;
    --text:#E7ECF5; --muted:#93a0b8; --faint:#6b7791;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.4);
    --bubble-ai:#1b2440; --bubble-ai-text:#E7ECF5;
  }
}
:root[data-theme="dark"]{
  --primary:#5B8DFF; --primary-light:#7BA4FF;
  --bg:#0A0E1A; --bg-2:#0e1424; --card:#141B2E; --card-2:#1a2338;
  --text:#E7ECF5; --muted:#93a0b8; --faint:#6b7791;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.4);
  --bubble-ai:#1b2440; --bubble-ai-text:#E7ECF5;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; font-size:15.5px; line-height:1.5;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,textarea{font-family:inherit; font-size:16px}
.hidden{display:none !important}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:0;height:0}

/* Splash */
#splash{position:fixed; inset:0; z-index:100; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px}
#splash img{width:120px;height:120px;object-fit:contain;border-radius:28px}
.brand-en{font-weight:800; font-size:24px; color:var(--primary); letter-spacing:-.3px}

/* Login */
#login{position:fixed; inset:0; z-index:80; background:var(--bg); overflow:auto;
  display:flex; align-items:center; justify-content:center; padding:32px 24px}
.login-box{width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; text-align:center}
.login-box img{width:150px;height:150px;object-fit:contain}
.login-title{font-weight:800; font-size:26px; color:var(--primary); margin:14px 0 4px}
.login-sub{color:var(--muted); font-size:14px; margin-bottom:34px}
.code-field{position:relative; width:100%}
.code-field .lock{position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none}
.code-input{width:100%; text-align:center; letter-spacing:12px; font-weight:700; font-size:26px;
  padding:16px 44px; border-radius:16px; border:1.5px solid var(--line); background:var(--card);
  color:var(--text); text-transform:uppercase}
.code-input:focus{outline:none; border-color:var(--primary)}
.code-input::placeholder{letter-spacing:10px; color:var(--faint)}
.err{color:var(--red); font-size:13px; margin-top:12px; font-weight:600}
.btn{width:100%; margin-top:22px; padding:15px; border-radius:999px; font-weight:700; font-size:16px;
  color:#fff; background:var(--primary); display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .06s, filter .15s}
.btn:active{transform:scale(.98)} .btn[disabled]{opacity:.6}
.btn-ghost{background:var(--card); color:var(--text); border:1px solid var(--line)}
.hint-box{margin-top:22px; width:100%; display:flex; gap:8px; align-items:center; padding:12px;
  border-radius:12px; background:color-mix(in srgb,var(--accent) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 28%,transparent); color:var(--muted); font-size:12.5px; text-align:left}

/* App shell */
#app{display:flex; flex-direction:column; height:100dvh}
.topbar{background:var(--navy); color:#fff; display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-top) + 10px) 12px 12px; min-height:56px; z-index:20}
.topbar .tb-title{font-weight:700; font-size:17px; flex:1; text-align:center; padding-inline:6px}
.tb-btn{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:#fff}
.tb-btn:active{background:rgba(255,255,255,.1)}
.tb-btn svg{width:21px;height:21px}
.tb-btn.disabled{opacity:.35; pointer-events:none}

.view{flex:1; overflow:auto; -webkit-overflow-scrolling:touch; position:relative}
.view-anim{animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

.tabbar{flex:none; display:flex; background:var(--navy); padding:8px 4px calc(var(--safe-bottom) + 8px)}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px;
  color:var(--muted-navy); font-size:11px; font-weight:600; position:relative; transition:color .15s}
.tab .ico{width:52px; height:30px; border-radius:999px; display:grid; place-items:center; transition:background .2s}
.tab svg{width:23px;height:23px}
.tab.active{color:#fff}
.tab.active .ico{background:color-mix(in srgb,var(--primary) 34%,transparent)}
.tab.active svg{color:var(--primary-light)}
.tab:active{transform:scale(.94)}

/* Chat */
.chat-wrap{display:flex; flex-direction:column; height:100%}
.seg{padding:10px 14px 4px}
.seg-track{display:flex; background:var(--card-2); border:1px solid var(--line); border-radius:14px; padding:3px}
.seg-btn{flex:1; padding:9px; border-radius:11px; font-weight:600; font-size:14px; color:var(--muted); transition:.15s}
.seg-btn.active{background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(59,111,242,.3)}
.thread{flex:1; overflow:auto; padding:10px 14px; display:flex; flex-direction:column; gap:9px}
.bubble{max-width:82%; padding:10px 13px; border-radius:18px; font-size:15px; line-height:1.55;
  white-space:pre-wrap; word-wrap:break-word; box-shadow:var(--shadow)}
.bubble .time{font-size:10px; opacity:.6; margin-top:3px; display:block}
.b-me{align-self:flex-end; background:var(--bubble-me); color:var(--bubble-me-text); border-bottom-right-radius:6px}
.b-ai{align-self:flex-start; background:var(--bubble-ai); color:var(--bubble-ai-text); border:1px solid var(--line); border-bottom-left-radius:6px}
.b-att{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.b-att img{width:130px; height:130px; object-fit:cover; border-radius:12px; background:var(--card-2); border:1px solid var(--line); cursor:pointer}
.att-cap{font-size:12px; opacity:.75; margin-top:3px}
.typing{align-self:flex-start; background:var(--bubble-ai); border:1px solid var(--line);
  padding:13px 16px; border-radius:18px; border-bottom-left-radius:6px; display:flex; gap:4px}
.typing i{width:7px;height:7px;border-radius:50%; background:var(--faint); animation:blink 1.2s infinite both}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25} 40%{opacity:1}}
.composer{flex:none; border-top:1px solid var(--line); background:var(--card);
  padding:9px 10px calc(var(--safe-bottom) + 9px); display:flex; align-items:flex-end; gap:7px}
.c-input{flex:1; background:var(--card-2); border:1px solid var(--line); border-radius:22px;
  padding:10px 15px; color:var(--text); resize:none; max-height:120px; line-height:1.4}
.c-input:focus{outline:none; border-color:var(--primary)}
.c-btn{width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; color:var(--muted);
  background:var(--card-2); border:1px solid var(--line)}
.c-btn:active{transform:scale(.92)} .c-btn svg{width:21px;height:21px}
.c-send{background:var(--primary); color:#fff; border:none}
.c-rec{background:var(--red); color:#fff; border:none; animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,40,40,.5)}70%{box-shadow:0 0 0 12px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
.attach-chip{display:flex; align-items:center; gap:9px; margin:0 14px 6px; padding:8px 10px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:13px}
.attach-chip img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.attach-chip .x{margin-left:auto; color:var(--muted); padding:4px; font-size:16px}

/* Board */
.searchbar{padding:12px 14px 4px}
.searchbar .sb{position:relative}
.searchbar .sb svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--faint); width:18px;height:18px}
.searchbar input{width:100%; padding:11px 14px 11px 40px; border-radius:12px; border:1px solid var(--line);
  background:var(--card); color:var(--text)}
.searchbar input:focus{outline:none; border-color:var(--primary)}
.filters{display:flex; gap:8px; overflow-x:auto; padding:10px 14px; }
.chip{flex:none; padding:8px 15px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted);
  background:var(--card); border:1px solid var(--line); white-space:nowrap}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary)}
.chip.today{color:var(--primary)} .chip.today.on{background:var(--primary); color:#fff}
.chip:active{transform:scale(.95)}
.board-list{padding:2px 14px calc(var(--safe-bottom) + 24px)}
.pcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px;
  margin-bottom:11px; box-shadow:var(--shadow); transition:transform .06s}
.pcard:active{transform:scale(.99)}
.pc-row1{display:flex; align-items:center; gap:8px}
.pc-name{font-weight:700; font-size:16px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pc-ticket{color:var(--primary); font-weight:700; font-size:13px}
.pc-copy{color:var(--faint); padding:2px}
.pc-sub{font-size:13px; color:var(--muted); margin-top:5px}
.pc-foot{display:flex; align-items:center; gap:6px; margin-top:12px; color:var(--muted); font-size:12.5px}
.pc-foot .badge{margin-left:auto; padding:4px 9px; border-radius:7px; font-size:11px; font-weight:700;
  background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent)}
.pc-foot .chev{color:var(--faint)}

/* States */
.state{padding:70px 30px; text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:12px}
.state .ic{width:84px;height:84px;border-radius:22px; background:color-mix(in srgb,var(--primary) 10%,transparent);
  display:grid; place-items:center; color:var(--primary)}
.state .ic svg{width:40px;height:40px}
.state h3{margin:0; color:var(--text); font-size:18px; font-weight:700}
.state p{margin:0; font-size:14px; max-width:280px}
.skel{background:var(--card); border:1px solid var(--line); border-radius:16px; height:104px; margin:0 14px 11px;
  position:relative; overflow:hidden}
.skel::after{content:""; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--muted) 9%,transparent),transparent);
  transform:translateX(-100%); animation:sh 1.3s infinite}
@keyframes sh{100%{transform:translateX(100%)}}
.retry{margin-top:6px; padding:10px 22px; border-radius:999px; background:var(--primary); color:#fff; font-weight:700}

/* Sheet */
.sheet-back{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); opacity:0; transition:opacity .25s}
.sheet-back.show{opacity:1}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--bg);
  border-radius:22px 22px 0 0; height:94dvh; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .32s cubic-bezier(.2,.85,.25,1)}
.sheet.show{transform:translateY(0)}
.sheet-head{display:flex; align-items:center; gap:8px; padding:calc(var(--safe-top) + 6px) 12px 12px;
  background:var(--navy); color:#fff; border-radius:22px 22px 0 0}
.sheet-head .st{flex:1; font-weight:700; font-size:16px; text-align:center}
.sheet-body{flex:1; overflow:auto; padding:14px 16px calc(var(--safe-bottom) + 30px)}
.actions{display:flex; gap:8px; overflow-x:auto; padding-bottom:14px}
.act{flex:none; display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 14px; border-radius:14px;
  background:var(--card); border:1px solid var(--line); color:var(--text); font-size:11.5px; font-weight:600; min-width:74px}
.act svg{width:20px;height:20px; color:var(--primary)}
.act.danger svg{color:var(--red)} .act.danger{color:var(--red)}
.act:active{transform:scale(.96)}
.det-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:12px}
.det-card h4{margin:0 0 12px; font-size:12px; color:var(--faint); text-transform:uppercase; letter-spacing:.6px; font-weight:700; display:flex; align-items:center; gap:7px}
.vital-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:9px}
.vital{background:var(--card-2); border:1px solid var(--line); border-radius:12px; padding:11px}
.vital .vv{font-weight:800; font-size:19px} .vital .vl{font-size:11px; color:var(--muted); margin-top:2px}
.li{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--line-2); font-size:14.5px; align-items:flex-start}
.li:last-child{border:none}
.li .dot{width:8px;height:8px;border-radius:50%; margin-top:7px; flex:none; background:var(--primary)}
.li .txt{flex:1} .li small{color:var(--muted); display:block; font-size:12px; margin-top:2px}
.li .ord-btn{width:30px;height:30px;border-radius:9px; display:grid;place-items:center; border:1px solid var(--line); color:var(--green); flex:none}
.li .ord-x{color:var(--red)}
.det-empty{color:var(--faint); font-size:13px}
.allergy{border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.allergy h4{color:var(--red)}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.tag{font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--card-2); color:var(--muted); border:1px solid var(--line)}
.tag.on{background:color-mix(in srgb,var(--green) 14%,transparent); color:var(--green); border-color:transparent}

/* Modal (unit picker / confirm) */
.modal-back{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45); display:grid; place-items:center; padding:26px}
.modal{background:var(--card); border-radius:20px; width:100%; max-width:360px; overflow:hidden; box-shadow:var(--shadow)}
.modal h3{margin:0; padding:18px 18px 6px; font-size:17px; font-weight:700}
.modal p{margin:0; padding:0 18px 12px; color:var(--muted); font-size:14px}
.modal .opt-list{max-height:52vh; overflow:auto}
.modal .opt{width:100%; text-align:left; padding:14px 18px; border-top:1px solid var(--line-2); font-size:15px; font-weight:600}
.modal .opt:active{background:var(--card-2)}
.modal-foot{display:flex; gap:8px; padding:12px 18px 16px}
.modal-foot button{flex:1; padding:12px; border-radius:999px; font-weight:700; font-size:15px}
.mf-cancel{background:var(--card-2); color:var(--text); border:1px solid var(--line)}
.mf-ok{background:var(--primary); color:#fff}
.mf-ok.danger{background:var(--red)}

/* Profile */
.prof{padding:16px 16px calc(var(--safe-bottom) + 26px)}
.prof-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; align-items:center; gap:16px; box-shadow:var(--shadow)}
.prof-av{width:64px;height:64px;border-radius:50%; background:color-mix(in srgb,var(--primary) 14%,transparent);
  display:grid; place-items:center; color:var(--primary); font-weight:800; font-size:22px; flex:none}
.prof-name{font-weight:800; font-size:19px}
.prof-role{color:var(--muted); font-size:14px; margin-top:1px}
.prof-spec{color:var(--faint); font-size:13px}
.sec-h{font-size:13px; font-weight:700; color:var(--muted); margin:20px 4px 8px}
.row{display:flex; align-items:center; gap:13px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:9px}
.row .ric{width:36px;height:36px;border-radius:11px; background:color-mix(in srgb,var(--primary) 12%,transparent); display:grid; place-items:center; color:var(--primary); flex:none}
.row .ric svg{width:19px;height:19px}
.row .rl{font-size:12px; color:var(--muted)} .row .rv{font-size:15px; font-weight:600; margin-top:1px}
.sub-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px}
.sub-top{display:flex; align-items:center; gap:10px}
.sub-plan{font-weight:700; font-size:17px; flex:1}
.pill{font-size:11px; font-weight:800; padding:4px 10px; border-radius:6px; text-transform:uppercase; letter-spacing:.4px}
.pill.on{background:color-mix(in srgb,var(--green) 14%,transparent); color:var(--green)}
.pill.off{background:color-mix(in srgb,var(--red) 14%,transparent); color:var(--red)}
.logout{width:100%; margin-top:24px; padding:15px; border-radius:999px; font-weight:700; color:var(--red);
  background:transparent; border:1.5px solid color-mix(in srgb,var(--red) 45%,transparent); display:flex; align-items:center; justify-content:center; gap:8px}
.logout:active{transform:scale(.98)}
.ver{text-align:center; color:var(--faint); font-size:12px; margin-top:16px}

/* Analytics */
.an{padding:16px 16px calc(var(--safe-bottom) + 26px)}
.an-scope{display:flex; background:var(--card-2); border:1px solid var(--line); border-radius:12px; padding:3px; margin-bottom:14px}
.an-scope button{flex:1; padding:9px; border-radius:9px; font-weight:600; font-size:14px; color:var(--muted)}
.an-scope button.active{background:var(--primary); color:#fff}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:16px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow)}
.stat .si{width:34px;height:34px;border-radius:10px; display:grid; place-items:center; margin-bottom:10px}
.stat .si svg{width:18px;height:18px}
.stat .sv{font-size:23px; font-weight:800; line-height:1} .stat .sl{font-size:12.5px; color:var(--muted); margin-top:3px}
.an-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow)}
.an-card h4{margin:0 0 16px; font-size:15px; font-weight:700}
.bar-row{margin-bottom:14px} .bar-row:last-child{margin:0}
.bar-top{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px}
.bar-top b{font-weight:800}
.bar-track{height:8px; border-radius:4px; background:var(--line); overflow:hidden}
.bar-fill{height:100%; border-radius:4px}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; justify-content:center}
.legend span{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:50%}

/* image viewer */
.viewer{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.92); display:grid; place-items:center; padding:20px}
.viewer img{max-width:100%; max-height:100%; border-radius:8px}
.viewer .vx{position:absolute; top:calc(var(--safe-top) + 12px); right:16px; color:#fff; font-size:30px; width:44px;height:44px}

/* toast + a2h */
.toast{position:fixed; left:50%; bottom:calc(var(--safe-bottom) + 84px); transform:translateX(-50%) translateY(20px);
  background:#0A0E1A; color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
  z-index:95; opacity:0; transition:.25s; max-width:88%; text-align:center; border:1px solid rgba(255,255,255,.12)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.a2h{position:fixed; left:12px; right:12px; bottom:calc(var(--safe-bottom) + 84px); z-index:55;
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:11px; font-size:13px}
.a2h img{width:34px;height:34px;border-radius:9px;flex:none}
.a2h b{font-weight:700} .a2h .x{margin-left:auto; color:var(--muted); padding:4px; font-size:16px}

/* Board report button */
.board-actions{display:flex; align-items:center; gap:10px; padding:2px 14px 10px}
.ba-count{font-size:13px; color:var(--muted); font-weight:600}
.ba-report{margin-left:auto; display:flex; align-items:center; gap:7px; padding:9px 16px; border-radius:999px;
  background:var(--primary); color:#fff; font-weight:700; font-size:13.5px; box-shadow:0 2px 8px rgba(59,111,242,.3)}
.ba-report svg{width:16px;height:16px}
.ba-report:active{transform:scale(.96)} .ba-report[disabled]{opacity:.5; box-shadow:none}

/* Discharged archive */
.disch-tools{position:sticky; top:0; z-index:1; background:var(--bg); margin:-2px 0 10px; padding-bottom:8px}
.disch-tools .sb{position:relative; margin-bottom:10px}
.disch-tools .sb svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--faint); width:18px; height:18px}
.disch-tools .sb input{width:100%; padding:11px 14px 11px 40px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text)}
.disch-tools .sb input:focus{outline:none; border-color:var(--primary)}
.disch-dates{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.disch-dates label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600}
.disch-dates input[type=date]{padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; min-width:0}
.disch-dates #dClear{padding:8px 14px}
.disch-actions{display:flex; align-items:center; gap:10px}

/* Report overlay (printable) */
.report-overlay{position:fixed; inset:0; z-index:120; background:#fff; color:#0A0E1A; display:flex; flex-direction:column; overflow:auto}
.rep-progress{margin:auto; display:flex; flex-direction:column; align-items:center; gap:12px; color:#5B6472; font-weight:600}
.report-bar{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px;
  padding:calc(var(--safe-top) + 10px) 10px 10px; background:#0A0E1A; color:#fff}
.report-bar .rt{flex:1; font-weight:700; font-size:15px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.report-bar button{color:#fff; font-weight:700; font-size:13px; padding:9px 12px; border-radius:11px;
  background:rgba(255,255,255,.15); display:flex; align-items:center; gap:6px}
.report-bar button svg{width:16px;height:16px}
.report-bar button.close{background:transparent; padding:9px}
.report-doc{max-width:820px; width:100%; margin:0 auto; padding:22px 20px 70px; background:#fff; color:#0A0E1A;
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.rep-head{display:flex; align-items:center; gap:12px; border-bottom:2px solid #0A0E1A; padding-bottom:14px; margin-bottom:10px}
.rep-head img{width:44px; height:44px; border-radius:10px; object-fit:contain}
.rep-head .rh-t{font-weight:800; font-size:18px} .rep-head .rh-s{font-size:12.5px; color:#5B6472; margin-top:2px}
.rep-meta{display:flex; flex-wrap:wrap; gap:4px 18px; font-size:12px; color:#5B6472; margin-bottom:18px}
.rep-meta b{color:#0A0E1A}
.rep-case{border:1px solid #e2e6ee; border-radius:12px; padding:14px 16px; margin-bottom:14px}
.rep-case .rc-h{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
.rep-case .rc-idx{color:#3B6FF2; font-weight:800; font-size:13px}
.rep-case .rc-n{font-weight:800; font-size:15.5px}
.rep-case .rc-tk{margin-left:auto; color:#3B6FF2; font-weight:700; font-size:13px}
.rep-case .rc-meta{font-size:12px; color:#5B6472; margin-bottom:10px}
.rep-sec{margin-top:9px}
.rep-sec .rs-t{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#8892a4; margin-bottom:2px}
.rep-sec .rs-b{font-size:12.5px; color:#0A0E1A}
.rep-sec ul{margin:2px 0; padding-left:18px} .rep-sec li{margin:1px 0}
.rep-allergy{background:#fdeaea; border:1px solid #f3c0c0; border-radius:8px; padding:7px 10px; margin:8px 0; font-size:12.5px; color:#C62828; font-weight:600}
.rep-overdue{color:#C62828; font-weight:700}
.rep-empty{color:#96a0b0; font-size:12px}

@media print{
  @page{margin:14mm}
  #splash,#login,#app,#sheetMount,#modalMount,#viewerMount,#a2hMount,#toast{display:none!important}
  .report-bar{display:none!important}
  .report-overlay{position:static!important; overflow:visible!important; z-index:auto}
  .report-doc{max-width:none; padding:0}
  .rep-case{break-inside:avoid; page-break-inside:avoid; border-color:#ccc}
  html,body{background:#fff!important}
}

<div id="a2hMount"></div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" />

<script>
"use strict";
const CFG = {
  SUPABASE_URL:"https://kaqoozpuvdvernvlmqbk.supabase.co",
  ANON:"sb_publishable_eDVjcLea7223PDB1seW-kQ_s0K5P-fP",
  N8N_BASE:"https://n8n-c1bz.srv1841520.hstgr.cloud",
  BUCKET:"attachments",
  BIND_DEVICE:false,          // true = bind entry code to this browser (like native device binding)
  APP_VERSION:"2.0.0 (web)"
};
const PLATFORM="mobile";

/* ---------------- state ---------------- */
const S = { code:null, staff:null, feats:[], tabs:[], tab:null, chatBot:"ed",
  board:{}, anScope:null, disch:null };
const BOT_TITLE = { ed:"Emergency Department", round:"Rounds", clinic:"Clinic" };
const BOT_SHORT = { ed:"ED", round:"Rounds", clinic:"Clinic" };

/* ---------------- helpers ---------------- */
const el=(id)=>document.getElementById(id);
const esc=(s)=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:k=>{try{return localStorage.getItem("awncare_"+k)}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem("awncare_"+k,v)}catch{}},del:k=>{try{localStorage.removeItem("awncare_"+k)}catch{}}};
function deviceId(){let d=store.get("device"); if(!d){d=(crypto.randomUUID?crypto.randomUUID():"d"+Date.now());store.set("device",d);} return d;}
let toastT; function toast(m){const t=el("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}
function timeStr(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});}
function initials(n){if(!n)return"?";const p=String(n).trim().split(/\s+/);return((p[0]?.[0]||"")+(p.length>1?p[p.length-1][0]:"")).toUpperCase();}
function age(y){return y?new Date().getFullYear()-y:null;}
function sexLabel(s){return s==="m"?"Male":(s==="f"?"Female":"");}
function ticketOf(h){return h?String(h).replace(/^t:/,""):"";}
function relDays(iso){if(!iso)return"";const d=Math.floor((Date.now()-new Date(iso))/864e5);if(d<=0)return"today";if(d===1)return"yesterday";return d+" days ago";}
function daysAgoDate(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}

/* ---------------- API ---------------- */
async function rpc(fn,params){
  const r=await fetch(`${CFG.SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",
    headers:{apikey:CFG.ANON,Authorization:"Bearer "+CFG.ANON,"Content-Type":"application/json"},
    body:JSON.stringify(params||{})});
  const txt=await r.text(); let d; try{d=JSON.parse(txt)}catch{d=txt}
  if(!r.ok){throw new Error(cleanErr((d&&(d.message||d.error||d.hint))||txt||("HTTP "+r.status)));}
  return d;
}
function cleanErr(m){m=String(m||"");
  const map={AWN_STAFF_NOT_FOUND:"Invalid entry code.",AWN_STAFF_PENDING:"Your account is under review.",
    AWN_STAFF_SUSPENDED:"Your account is suspended — contact your admin.",AWN_NO_PLAN:"No plan linked to your account.",
    AWN_BOT_NOT_ENABLED:"This module isn't enabled on your plan.",AWN_DEVICE_MISMATCH:"This code is registered on another device.",
    AWN_ENCOUNTER_NOT_FOUND:"Patient not found."};
  for(const k in map) if(m.includes(k)) return map[k];
  if(/^AWN_/.test(m)&&m.includes(":")) return m.slice(m.indexOf(":")+1).trim();
  if(/not unique|does not exist|permission denied/i.test(m)) return "Service error. Please try again.";
  return m;
}
function ingestProblem(code){
  const m={order_not_found_or_not_pending:"This order is no longer pending.",
    order_not_found_or_not_completed:"This order isn't marked completed.",
    order_id_required:"Missing order reference.",unknown_event_type:"This action isn't supported.",
    occurred_at_missing:"A time is required for this action.",occurred_at_future:"The time can't be in the future.",
    occurred_at_too_old:"The time is too far in the past."};
  return m[code]||(code?String(code).replace(/_/g," "):"The action couldn't be completed.");
}
const resolveStaff=(code)=>{const p={p_platform:PLATFORM,p_bot_key:"ed",p_chat_id:code}; if(CFG.BIND_DEVICE)p.p_device_id=deviceId(); return rpc("app_resolve_staff",p);};
const encounterList=(bot,filter,from,to)=>{
  const p={p_platform:PLATFORM,p_bot_key:bot,p_chat_id:S.code,p_filter:filter,p_category:null};
  if(from) p.p_from=from; if(to) p.p_to=to;
  return rpc("app_encounter_list",p).then(r=>(r&&r.results)||[]);
};
const patientSummary=(bot,enc)=>rpc("app_patient_summary",{p_platform:PLATFORM,p_bot_key:bot,p_chat_id:S.code,p_encounter_id:enc});
const chatHistory=(bot,limit)=>rpc("app_chat_history",{p_platform:PLATFORM,p_bot_key:bot,p_chat_id:S.code,p_limit:limit});
const listUnits=(bot)=>rpc("app_list_units",{p_platform:PLATFORM,p_bot_key:bot,p_chat_id:S.code});
const analyticsSummary=(bot,days,scope)=>rpc("app_analytics_summary",{p_platform:PLATFORM,p_bot_key:bot,p_chat_id:S.code,p_days:days||30,p_scope:scope||"mine"});
async function ingest(bot,events){const r=await rpc("app_ingest_events",{p_platform:PLATFORM,p_bot_key:bot,p_chat_id:S.code,p_events:events,p_dry_run:false});
  if(r&&r.status&&r.status!=="ok"){const p=r.problems&&r.problems[0]; throw new Error((p&&(p.ask||ingestProblem(p.problem)))||"The action couldn't be completed.");}
  return r;}
async function admit(bot,enc,bed){const r=await rpc("app_admit",{p_platform:PLATFORM,p_bot_key:bot,p_chat_id:S.code,p_encounter_id:enc,p_bed:bed});
  if(r&&r.status&&r.status!=="ok") throw new Error(cleanErr(r.reason||"Admit failed")); return r;}
async function sendToBot(bot,payload){
  const r=await fetch(`${CFG.N8N_BASE}/webhook/${bot}-mobile`,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({chat_id:S.code,bot_key:bot},payload))});
  const txt=await r.text(); let d; try{d=JSON.parse(txt)}catch{d={reply_text:txt}}
  if(!r.ok) throw new Error("Couldn't send the message ("+r.status+").");
  if(Array.isArray(d)) d=d[0]||{};
  return {reply_text:aiText(d),attachments:d.attachments||[]};
}
async function uploadFile(file,kind){
  const ext=(file.name&&file.name.includes("."))?file.name.split(".").pop():(file.type.split("/")[1]||"bin").replace("jpeg","jpg");
  const path=`mobile/${S.code}/${kind}/${Date.now()}-${Math.random().toString(16).slice(2,8)}.${ext}`;
  const r=await fetch(`${CFG.SUPABASE_URL}/storage/v1/object/${CFG.BUCKET}/${encodeURI(path)}`,{method:"POST",
    headers:{apikey:CFG.ANON,Authorization:"Bearer "+CFG.ANON,"Content-Type":file.type||"application/octet-stream","x-upsert":"true"},body:file});
  if(!r.ok){throw new Error("Upload failed: "+cleanErr(await r.text()));}
  return path;
}
const signedCache={};
async function signedUrl(path){if(!path)return""; if(signedCache[path])return signedCache[path];
  try{const r=await fetch(`${CFG.SUPABASE_URL}/storage/v1/object/sign/${CFG.BUCKET}/${encodeURI(path)}`,{method:"POST",
      headers:{apikey:CFG.ANON,Authorization:"Bearer "+CFG.ANON,"Content-Type":"application/json"},body:JSON.stringify({expiresIn:3600})});
    if(!r.ok)return""; const j=await r.json(); const u=`${CFG.SUPABASE_URL}/storage/v1${j.signedURL||j.signedUrl||""}`; signedCache[path]=u; return u;
  }catch{return""}}

/* ---------------- login ---------------- */
async function doLogin(code){
  const btn=el("loginBtn"),errB=el("loginErr"); errB.classList.add("hidden");
  code=(code||"").trim().toUpperCase();
  if(code.length<4){errB.textContent="Enter a valid entry code.";errB.classList.remove("hidden");return;}
  btn.disabled=true; btn.innerHTML='<svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>';
  try{
    const staff=await resolveStaff(code);
    S.code=code; S.staff=staff; S.feats=Array.isArray(staff.features)?staff.features:[];
    store.set("code",code);
    enterApp();
  }catch(e){ errB.textContent=cleanErr(e.message||"Sign-in failed."); errB.classList.remove("hidden"); }
  finally{ btn.disabled=false; btn.textContent="Sign In"; }
}
function enterApp(){
  el("splash").classList.add("hidden"); el("login").classList.add("hidden"); el("app").classList.remove("hidden");
  buildTabs(); maybeA2H();
}
function logout(){ store.del("code"); S.code=null; S.staff=null; S.feats=[];
  el("app").classList.add("hidden"); el("login").classList.remove("hidden"); }

/* ---------------- tabs ---------------- */
function has(f){return S.feats.includes(f);}
function buildTabs(){
  const hasEd=has("ed_module"),hasRound=has("round_module"),hasClinic=has("clinic_module");
  const hasAny=hasEd||hasRound||hasClinic;
  const T=[];
  if(hasAny) T.push({k:"chat",label:"Chat",icon:ic_chat});
  if(hasEd) T.push({k:"ed",label:"ED",icon:ic_ed,bot:"ed"});
  if(hasRound) T.push({k:"round",label:"Rounds",icon:ic_round,bot:"round"});
  if(hasClinic) T.push({k:"clinic",label:"Clinic",icon:ic_clinic,bot:"clinic"});
  if(hasAny) T.push({k:"analytics",label:"Analytics",icon:ic_an});
  T.push({k:"profile",label:"Profile",icon:ic_prof});
  S.tabs=T;
  // chat default bot = first enabled
  S.chatBot = hasEd?"ed":hasRound?"round":hasClinic?"clinic":"ed";
  // board state
  T.filter(t=>t.bot).forEach(t=>{ if(!S.board[t.bot]) S.board[t.bot]={filter:"all",q:"",date:null,unit:null,list:[]}; });
  // analytics scope
  S.anScope = (hasEd||hasRound) ? "hospital" : (hasClinic?"clinic":null);

  const bar=el("tabbar"); bar.innerHTML="";
  T.forEach(t=>{
    const b=document.createElement("button"); b.className="tab"; b.dataset.k=t.k;
    b.innerHTML=`<span class="ico">${t.icon}</span><span>${t.label}</span>`;
    b.onclick=()=>setTab(t.k); bar.appendChild(b);
  });
  setTab(T[0].k);
}
function setTab(k){
  S.tab=k;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.k===k));
  const t=S.tabs.find(x=>x.k===k);
  el("topTitle").textContent = k==="chat"?"Chat":k==="analytics"?"Analytics":k==="profile"?"Profile":BOT_TITLE[t.bot]||t.label;
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  setTopActions(k,t);
  const v=el("view"); v.classList.remove("view-anim"); void v.offsetWidth; v.classList.add("view-anim");
  if(k==="chat") renderChat();
  else if(t&&t.bot) renderBoard(t.bot);
  else if(k==="analytics") renderAnalytics();
  else if(k==="profile") renderProfile();
}
function setTopActions(k,t){
  const a1=el("tbAction1"),a2=el("tbAction2");
  a1.className="tb-btn"; a2.className="tb-btn"; a1.innerHTML=""; a2.innerHTML=""; a1.onclick=null; a2.onclick=null;
  if(t&&t.bot){
    a1.innerHTML=ic_history; a1.title="Discharged"; a1.onclick=()=>openDischarged(t.bot);
    a2.innerHTML=ic_refresh; a2.title="Refresh"; a2.onclick=()=>loadBoard(t.bot);
  } else if(k==="chat"){
    a2.innerHTML=ic_refresh; a2.onclick=()=>loadHistory();
  } else if(k==="analytics"){
    a2.innerHTML=ic_refresh; a2.onclick=()=>renderAnalytics(true);
  }
}

/* ---------------- CHAT ---------------- */
let pendingPhoto=null;
function chatBots(){return ["ed","round","clinic"].filter(b=>has(b+"_module"));}
function renderChat(){
  const bots=chatBots(); if(!bots.includes(S.chatBot)) S.chatBot=bots[0];
  el("view").innerHTML=`
    <div class="chat-wrap">
      ${bots.length>1?`<div class="seg"><div class="seg-track">
        ${bots.map(b=>`<button class="seg-btn ${b===S.chatBot?'active':''}" data-b="${b}">${BOT_SHORT[b]}</button>`).join("")}
      </div></div>`:""}
      <div class="thread" id="thread"></div>
      <div id="attachChip"></div>
      <div class="composer">
        <button class="c-btn" id="camBtn">${ic_cam}</button>
        <textarea class="c-input" id="chatInput" rows="1" placeholder="Message..."></textarea>
        <button class="c-btn" id="micBtn">${ic_mic}</button>
        <button class="c-btn c-send" id="sendBtn">${ic_send}</button>
      </div>
    </div>`;
  document.querySelectorAll(".seg-btn").forEach(b=>b.onclick=()=>{S.chatBot=b.dataset.b;renderChat();});
  const inp=el("chatInput");
  inp.oninput=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,120)+"px";};
  inp.onkeydown=(e)=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();onSend();}};
  el("sendBtn").onclick=onSend; el("micBtn").onclick=toggleRec; el("camBtn").onclick=()=>el("cameraInput").click();
  clearPending(); loadHistory();
}
const thread=()=>el("thread");
function scrollThread(){const t=thread();if(t)t.scrollTop=t.scrollHeight+999;}
async function loadHistory(){
  const t=thread(); if(!t)return;
  t.innerHTML=`<div style="margin:auto"><svg class="spin" width="26" height="26" viewBox="0 0 24 24" fill="none" style="color:var(--primary)"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".2" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>`;
  try{
    const rows=await chatHistory(S.chatBot,60);
    if(thread()!==t)return; t.innerHTML="";
    if(!rows||!rows.length){ t.innerHTML=emptyState(ic_chat,"Start the conversation","Type, record a voice note, or send a photo — the assistant replies and records everything."); return; }
    rows.forEach(r=>appendHistory(r.message)); scrollThread();
  }catch(e){ if(thread()===t) t.innerHTML=emptyState(ic_alert,"Couldn't load chat",esc(e.message)); }
}
// Strip the context envelope n8n prepends to the stored human message (date/IDs/etc.),
// keeping only the doctor's actual text after the "رسالة الدكتور:" marker.
function humanText(x){
  const s=String(x==null?"":x);
  const marks=["رسالة الدكتور:","رسالة الطبيب:","Doctor's message:","Doctor message:"];
  for(const m of marks){ const i=s.lastIndexOf(m); if(i>=0) return s.slice(i+m.length).trim(); }
  return s;
}
// The bots may reply with a structured JSON object ({ask, echo, patients, ...}).
// Show the human-readable field, never the raw JSON.
function aiText(x){
  let o=x;
  if(typeof x==="string"){
    const s=x.trim();
    if((s.startsWith("{")&&s.endsWith("}"))||(s.startsWith("[")&&s.endsWith("]"))){
      try{ o=JSON.parse(s); }catch{ return x; }
    } else return x;
  }
  if(Array.isArray(o)) o=o[0]||{};
  if(o&&typeof o==="object"){
    const t=(o.reply_text??o.ask??o.echo??o.output??o.reply??o.message??o.text);
    if(t!=null&&t!=="") return aiText(t);
    return "تم ✅";
  }
  return String(x==null?"":x);
}
function appendHistory(m){ if(!m)return;
  const type=m.type||m.role||(m.data&&m.data.type);
  const content=(m.data&&m.data.content)!=null?m.data.content:(m.content||"");
  if(type==="human"||type==="user"){ const t=humanText(content); if(String(t).trim()) addBubble("me",t); }
  else if(type==="ai"||type==="assistant"){ const t=aiText(content); if(String(t).trim()) addBubble("ai",t); }
}
function addBubble(side,text,atts,ts){
  const t=thread(); if(!t)return null;
  const b=document.createElement("div"); b.className="bubble "+(side==="me"?"b-me":"b-ai");
  b.innerHTML=esc(text)+(ts?`<span class="time">${esc(ts)}</span>`:"");
  t.appendChild(b); if(atts&&atts.length) renderBubbleAtts(b,atts); scrollThread(); return b;
}
async function renderBubbleAtts(bubble,atts){
  const w=document.createElement("div"); w.className="b-att"; bubble.appendChild(w);
  for(const a of atts){ const path=a.storage_path||a.path; if(!path)continue;

}

/* voice */
let mediaRec=null,recChunks=[],recStream=null;
async function toggleRec(){
  const mic=el("micBtn");
  if(mediaRec&&mediaRec.state==="recording"){mediaRec.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("Voice recording isn't supported in this browser.");return;}
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch{toast("Microphone permission needed.");return;}
  recChunks=[]; let mime="";
  if(window.MediaRecorder.isTypeSupported){
    if(MediaRecorder.isTypeSupported("audio/mp4"))mime="audio/mp4";
    else if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))mime="audio/webm;codecs=opus";
    else if(MediaRecorder.isTypeSupported("audio/webm"))mime="audio/webm";
  }
  try{mediaRec=mime?new MediaRecorder(recStream,{mimeType:mime}):new MediaRecorder(recStream);}catch{mediaRec=new MediaRecorder(recStream);}
  mediaRec.ondataavailable=(e)=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  mediaRec.onstop=onRecStop; mediaRec.start();
  mic.classList.add("c-rec"); mic.innerHTML='<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>';
  toast("Recording… tap again to stop & send");
}
async function onRecStop(){
  const mic=el("micBtn"); if(mic){mic.classList.remove("c-rec"); mic.innerHTML=ic_mic;}
  if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
  const type=(mediaRec&&mediaRec.mimeType)||"audio/webm"; const blob=new Blob(recChunks,{type}); if(!blob.size)return;
  const ext=type.includes("mp4")?"m4a":(type.includes("webm")?"webm":"ogg");
  const file=new File([blob],"voice."+ext,{type});
  addBubble("me","🎤 Voice message",null,timeStr(new Date().toISOString())); const ty=showTyping();
  try{const path=await uploadFile(file,"voice"); const res=await sendToBot(S.chatBot,{type:"voice",audio_storage_path:path});
    ty?.remove(); addBubble("ai",res.reply_text,res.attachments,timeStr(new Date().toISOString()));}
  catch(e){ty?.remove(); addBubble("ai","⚠️ "+e.message);}
}

async function mapLimit(items,limit,fn,onProg){
  const out=new Array(items.length); let i=0,done=0;
  async function w(){ while(i<items.length){ const k=i++; try{out[k]=await fn(items[k],k);}catch(e){out[k]={__err:e};} onProg&&onProg(++done);} }
  await Promise.all(Array.from({length:Math.max(1,Math.min(limit,items.length))},w));
  return out;
}

async function runReport(bot, rows, titleObj){
  if(!rows.length){ toast("No cases to report."); return; }

    <div>Preparing report…</div><div id="repProg">0 / ${rows.length}</div></div></div>`;
  const sums=await mapLimit(rows,4,(r)=>patientSummary(bot,r.encounter_id),(d)=>{const p=el("repProg");if(p)p.textContent=d+" / "+rows.length;});
  const cases=rows.map((r,i)=>({row:r, data:(sums[i]&&!sums[i].__err)?sums[i]:null}));
  renderReport(cases, titleObj);
}

  const ord=(d.open_orders||[]), med=(d.active_medications||[]), comp=(d.open_complications||[]), commit=(d.open_commitments||[]);

  const sec=(title,body)=> body?`<div class="rep-sec"><div class="rs-t">${title}</div><div class="rs-b">${body}</div></div>`:"";
  return `<div class="rep-case">
    <div class="rc-h"><span class="rc-idx">#${idx}</span><span class="rc-n">${esc(p.name||r.patient||"Unknown")}</span>${tk?`<span class="rc-tk">#${esc(tk)}</span>`:""}</div>
    <div class="rc-meta">${meta}</div>
    ${(p.allergies&&p.allergies.length)?`<div class="rep-allergy">⚠ Allergies: ${p.allergies.map(esc).join(", ")}</div>`:""}
    ${sec("Vitals", vit||`<span class="rep-empty">None recorded</span>`)}
    ${sec("Pending orders", ord.length?ul(ord.map(o=>esc(o.name)+(o.category?` <span style="color:#8892a4">(${esc(o.category)})</span>`:""))):`<span class="rep-empty">None</span>`)}
    ${sec("Medications", med.length?ul(med.map(m=>{const dt=[m.dose,m.route,m.frequency].filter(Boolean).map(esc).join(", ");return esc(m.name)+(dt?` <span style="color:#8892a4">(${dt})</span>`:"");})):`<span class="rep-empty">None</span>`)}
    ${comp.length?sec("Complications", ul(comp.map(x=>esc(x.description)))):""}
    ${commit.length?sec("Commitments", ul(commit.map(k=>esc(k.text)+(k.overdue?` <span class="rep-overdue">(overdue)</span>`:"")))):""}
    ${dx.length?sec("Diagnosis", dx.join("; ")):""}
  </div>`;
}
function reportText(cases, titleObj){
  const t=titleObj; const L=[];
  L.push("AWN CARE — CLINICAL REPORT");
  L.push(t.base+" · "+t.scope);
  L.push("Physician: "+((S.staff&&S.staff.full_name)||"—"));
  L.push("Generated: "+new Date().toLocaleString("en-US"));
  L.push(cases.length+" case(s)"); L.push("");
  cases.forEach((c,i)=>{ const r=c.row;
    if(!c.data){ L.push(`#${i+1} ${r.patient||"Unknown"} — details unavailable`); L.push(""); return; }
    const d=c.data, p=d.patient||{}, e=d.encounter||{}, a=age(p.birth_year);
    const tk=ticketOf(e.handle||r.handle);
    L.push(`#${i+1} ${p.name||r.patient||"Unknown"}${tk?"  #"+tk:""}`);
    L.push("  "+[sexLabel(p.sex),a?a+"y":"",p.mrn?"MRN "+p.mrn:"",e.unit,e.attending?"Dr. "+e.attending:"",r.days_open!=null?r.days_open+"d open":"",e.status].filter(Boolean).join(" · "));
    if(p.allergies&&p.allergies.length) L.push("  ! Allergies: "+p.allergies.join(", "));
    const vit=(d.latest_vitals||[]).map(v=>metricLabel(v.metric)+" "+v.value+(v.unit?" "+v.unit:"")).join(" · ");
    if(vit) L.push("  Vitals: "+vit);
    const ord=(d.open_orders||[]); if(ord.length) L.push("  Orders: "+ord.map(o=>o.name+(o.category?" ("+o.category+")":"")).join(", "));
    const med=(d.active_medications||[]); if(med.length) L.push("  Meds: "+med.map(m=>{const dt=[m.dose,m.route,m.frequency].filter(Boolean).join(", ");return m.name+(dt?" ("+dt+")":"");}).join(", "));
    const comp=(d.open_complications||[]); if(comp.length) L.push("  Complications: "+comp.map(x=>x.description).join("; "));
    const commit=(d.open_commitments||[]); if(commit.length) L.push("  Commitments: "+commit.map(k=>k.text+(k.overdue?" (overdue)":"")).join("; "));
    const dx=(d.recent_notes||[]).filter(n=>n.kind==="diagnosis").map(n=>n.body); if(dx.length) L.push("  Diagnosis: "+dx.join("; "));
    L.push("");
  });
  return L.join("\n");
}

function cap1(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}

function barChart(data){
  if(!data.length)return `<div class="det-empty">No data.</div>`;
  const max=Math.max(1,...data.map(d=>d.count||0));
  const W=Math.max(data.length*26,280),H=170,pad=22;
  const bw=(W-8)/data.length*.62;
  let bars="",labels="";
  data.forEach((d,i)=>{const x=8+i*((W-8)/data.length)+((W-8)/data.length-bw)/2;
    const h=(d.count/max)*(H-pad-16); const y=H-pad-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="3" fill="var(--primary)"/>`;
    if(i%2===0||i===data.length-1){const dt=new Date(d.date);labels+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" font-size="9" fill="var(--faint)" text-anchor="middle">${dt.getDate()}/${dt.getMonth()+1}</text>`;}
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">${bars}${labels}</svg>`;
}
const AN_PAL=["#3B6FF2","#E65100","#2E7D32","#C62828","#5B8DFF","#14b8a6","#7c3aed","#8d6e63"];
function donut(data){
  const total=data.reduce((a,b)=>a+(b.count||0),0)||1; const r=52,c=2*Math.PI*r; let off=0,segs="";
  data.forEach((d,i)=>{const frac=(d.count||0)/total;const len=frac*c;
    segs+=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${AN_PAL[i%AN_PAL.length]}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    off+=len;});
  const legend=data.map((d,i)=>`<span><i style="background:${AN_PAL[i%AN_PAL.length]}"></i>${esc(d.unit||d.label||"—")} (${d.count})</span>`).join("");
  return `<div style="text-align:center"><svg viewBox="0 0 140 140" width="150" height="150">${segs}</svg></div><div class="legend">${legend}</div>`;
}
function hbars(data,key,cap){
  const max=Math.max(1,...data.map(d=>d.count||0));
  return data.map((d,i)=>{let lbl=d[key]||d.label||"—";if(cap&&lbl)lbl=lbl.charAt(0).toUpperCase()+lbl.slice(1);
    const w=Math.max(3,(d.count/max)*100);
    return `<div class="bar-row"><div class="bar-top"><span>${esc(lbl)}</span><b>${d.count}</b></div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${AN_PAL[i%AN_PAL.length]}"></div></div></div>`;}).join("");
}

function roleLabel(r){return ({resident:"Resident Physician",doctor:"Physician",admin:"Admin",owner:"Owner",nurse:"Nurse",consultant:"Consultant"})[r]||(r||"Physician");}
function featLabel(k){return ({ed_module:"Emergency (ED)",round_module:"Rounds",clinic_module:"Clinic",analytics_module:"Analytics",health_education:"Health Education"})[k]||String(k).split("_").map(w=>w?w[0].toUpperCase()+w.slice(1):"").join(" ");}
function metricLabel(m){return ({temp:"Temp",hr:"HR",rr:"RR",spo2:"SpO₂",sbp:"SBP",dbp:"DBP",bp:"BP",glucose:"Glucose",gcs:"GCS",pain:"Pain",weight:"Weight",map:"MAP"})[m]||m;}
function kindLabel(k){return ({complaint:"Complaint",history:"History",exam:"Exam",diagnosis:"Diagnosis",health_education:"Education",note:"Note"})[k]||k;}

/* ---------------- modals / viewer ---------------- */
function confirmModal(title,body,okLabel,danger,onOk){
  el("modalMount").innerHTML=`<div class="modal-back" id="mBack"><div class="modal">
    <h3>${esc(title)}</h3><p>${esc(body)}</p>
    <div class="modal-foot"><button class="mf-cancel" id="mCancel">Cancel</button><button class="mf-ok ${danger?'danger':''}" id="mOk">${esc(okLabel)}</button></div>
  </div></div>`;
  const close=()=>el("modalMount").innerHTML="";
  el("mCancel").onclick=close; el("mBack").onclick=(e)=>{if(e.target.id==="mBack")close();};
  el("mOk").onclick=()=>{close();onOk&&onOk();};
}
function pickModal(title,options,onPick){
  el("modalMount").innerHTML=`<div class="modal-back" id="mBack"><div class="modal">
    <h3>${esc(title)}</h3><div class="opt-list">${options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.label)}</button>`).join("")}</div>
    <div class="modal-foot"><button class="mf-cancel" id="mCancel">Cancel</button></div></div></div>`;
  const close=()=>el("modalMount").innerHTML="";
  el("mCancel").onclick=close; el("mBack").onclick=(e)=>{if(e.target.id==="mBack")close();};

function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches; store.set("theme",dark?"light":"dark"); applyTheme();}
function maybeA2H(){
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=("standalone"in navigator)&&navigator.standalone;
  if(!iOS||standalone||store.get("a2h")) return;
  el("a2hMount").innerHTML=`<div class="a2h"><img src="app_logo.png"><div>For the full app feel: tap <b>Share</b> → <b>Add to Home Screen</b>.</div><button class="x" id="a2x">✕</button></div>`;
  el("a2x").onclick=()=>{store.set("a2h","1");el("a2hMount").innerHTML="";};

/* ---------------- boot ---------------- */
function boot(){
  applyTheme();
  el("themeBtn").onclick=toggleTheme;
  el("loginBtn").onclick=()=>doLogin(el("codeInput").value);
  const ci=el("codeInput");
  ci.oninput=()=>{ci.value=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);};
  ci.onkeydown=(e)=>{if(e.key==="Enter")doLogin(ci.value);};
  el("cameraInput").onchange=(e)=>{const f=e.target.files[0];if(f)setPending(f);e.target.value="";};
  const saved=store.get("code");
  setTimeout(async()=>{
    if(saved){ try{ const staff=await resolveStaff(saved); S.code=saved; S.staff=staff; S.feats=Array.isArray(staff.features)?staff.features:[]; enterApp(); return; }
      catch{ store.del("code"); } }
    el("splash").classList.add("hidden"); el("login").classList.remove("hidden");
    setTimeout(()=>el("codeInput").focus(),200);
  },650);
}
document.addEventListener("DOMContentLoaded",boot);
window.closeSheet=closeSheet; window.loadBoard=loadBoard;
