<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول — داشبورد المدير</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="config.js"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>داشبورد <span class="brand-accent">المدير</span></h1>
      <p class="muted">سجّل دخولك بحساب الإداري بتاعك.</p>

      <div class="field">
        <label for="email">الإيميل</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">كلمة السر</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn" style="width:100%">دخول</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
  </div>

  <script type="module">
    import { supabase } from "./assets/supabase.js";

    // لو فيه جلسة شغالة أصلًا، حوّل على الصفحة الرئيسية على طول.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) location.href = "index.html";

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = "فشل تسجيل الدخول: " + error.message;
        return;
      }
      location.href = "index.html";
    });
  </script>
</body>
</html>
